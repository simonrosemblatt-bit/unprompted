<style>
  :root{
    --bg:#0F0D0B;
    --surface:#171410;
    --ivory:#EFE7D6;
    --muted:#9A917F;
    --faint:#6B6357;
    --hair:#2A2620;
    --amber:#E0A24A;
    --amber-deep:#C97F2E;
    --clay:#C25A3E;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ivory);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:clamp(20px,4vw,56px) clamp(18px,4vw,40px);
    position:relative;
    overflow-x:hidden;
  }
  /* ambient warm glow behind the concept */
  body::before{
    content:"";
    position:fixed;
    top:38%;left:50%;
    width:min(720px,90vw);height:min(720px,90vw);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(224,162,74,.10), rgba(224,162,74,0) 62%);
    pointer-events:none;
    z-index:0;
  }
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    gap:clamp(26px,4vw,42px);
  }

  /* ---- masthead ---- */
  .masthead{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .wordmark{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(1.5rem,4vw,2rem);
    letter-spacing:.01em;
    font-variation-settings:"SOFT" 20,"WONK" 1,"opsz" 40;
  }
  .tagline{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.02em;
    max-width:34ch;
    line-height:1.5;
  }

  /* ---- concept card ---- */
  .card{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:clamp(20px,3vw,32px) 4px;
    min-height:230px;
    justify-content:center;
  }
  .field{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--faint);
    min-height:14px;
    transition:color .4s ease;
  }
  .card.revealed .field{color:var(--amber-deep)}
  .concept-wrap{position:relative;display:inline-block;max-width:100%}
  .concept{
    margin:0;
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(2.2rem,7.5vw,4.6rem);
    line-height:1.02;
    letter-spacing:-.012em;
    font-variation-settings:"SOFT" 34,"WONK" 1,"opsz" 144;
    color:var(--ivory);
    transition:opacity .35s ease, filter .35s ease;
  }
  .card.idle .concept{color:var(--faint);font-weight:400;font-size:clamp(1.6rem,5vw,2.6rem)}
  .card.shuffling .concept{opacity:.5;filter:blur(1.2px)}
  /* hand-drawn ink underline */
  .underline{
    display:block;
    width:min(100%,34ch);
    height:18px;
    margin:2px auto 0;
    opacity:0;
  }
  .card.revealed .underline{opacity:1}
  .underline path{
    fill:none;
    stroke:var(--amber);
    stroke-width:2.4;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:1;
    stroke-dashoffset:1;
  }
  .underline.draw path{animation:ink .9s cubic-bezier(.65,0,.35,1) forwards}
  @keyframes ink{to{stroke-dashoffset:0}}
  .alt{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
    min-height:16px;
    letter-spacing:.01em;
  }
  .alt a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair)}
  .alt a:hover{color:var(--amber);border-color:var(--amber-deep)}

  /* ---- primary controls ---- */
  .controls{
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .draw{
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bg);
    background:var(--amber);
    border:none;
    padding:15px 30px;
    border-radius:2px;
    cursor:pointer;
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
    box-shadow:0 0 0 rgba(224,162,74,0);
  }
  .draw:hover{background:#EBB061;box-shadow:0 8px 30px rgba(224,162,74,.22)}
  .draw:active{transform:translateY(1px)}
  .select-wrap{position:relative}
  select{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ivory);
    background:var(--surface);
    border:1px solid var(--hair);
    padding:14px 34px 14px 14px;
    border-radius:2px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
  }
  .select-wrap::after{
    content:"▾";
    position:absolute;right:13px;top:50%;transform:translateY(-50%);
    color:var(--faint);pointer-events:none;font-size:11px;
  }

  /* ---- timer ---- */
  .timer{
    border:1px solid var(--hair);
    border-radius:3px;
    background:linear-gradient(180deg,rgba(23,20,16,.7),rgba(15,13,11,.4));
    padding:22px clamp(16px,3vw,28px) 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
  .seg button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    background:transparent;
    border:none;
    padding:10px 16px;
    cursor:pointer;
    transition:color .2s,background .2s;
  }
  .seg button + button{border-left:1px solid var(--hair)}
  .seg button.active{color:var(--bg);background:var(--muted)}
  .clock{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(3rem,13vw,5rem);
    letter-spacing:.02em;
    line-height:1;
    color:var(--ivory);
    font-variant-numeric:tabular-nums;
    transition:color .3s ease;
  }
  .clock.low{color:var(--amber)}
  .clock.done{color:var(--clay);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .timer-btns{display:flex;gap:10px}
  .tbtn{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ivory);
    background:transparent;
    border:1px solid var(--hair);
    padding:11px 20px;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .tbtn:hover{border-color:var(--amber-deep);color:var(--amber)}
  .tbtn.primary{border-color:var(--amber);color:var(--amber)}
  .sound{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    color:var(--faint);background:none;border:none;cursor:pointer;
    text-transform:uppercase;
  }
  .sound:hover{color:var(--muted)}

  /* ---- rules footer ---- */
  .rules{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:10px 12px;
    padding-top:2px;
  }
  .chip{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--hair);
    border-radius:100px;
    padding:7px 14px;
    display:inline-flex;
    gap:7px;
    align-items:center;
  }
  .chip b{color:var(--amber-deep);font-weight:700}
  .meta{
    width:100%;
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--faint);
    margin-top:6px;
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
  }
  .meta button{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--faint);background:none;border:none;cursor:pointer;
    border-bottom:1px solid var(--hair);padding:0 0 1px;
  }
  .meta button:hover{color:var(--amber)}

  a:focus-visible,button:focus-visible,select:focus-visible{
    outline:2px solid var(--amber);outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .underline.draw path{animation:none;stroke-dashoffset:0}
    .clock.done{animation:none}
    .concept{transition:none}
  }
</style>
</head>
<body>
  <main class="stage">
    <header class="masthead">
      <div class="eyebrow">Ritual semanal</div>
      <div class="wordmark">Unprompted</div>
      <p class="tagline">Saca un tema al azar. Investígalo 15 minutos. Preséntalo en uno.</p>
    </header>

    <section class="card idle" id="card">
      <div class="field" id="field">Disciplina</div>
      <div class="concept-wrap">
        <h1 class="concept" id="concept" aria-live="polite">Pulsa para empezar</h1>
        <svg class="underline" id="underline" viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M4 12 C 46 5, 92 6, 138 10 S 224 16, 296 7"></path>
        </svg>
      </div>
      <div class="alt" id="alt"></div>
    </section>

    <div class="controls">
      <div class="select-wrap">
        <select id="filter" aria-label="Filtrar por disciplina">
          <option value="all">Todas las disciplinas</option>
        </select>
      </div>
      <button class="draw" id="draw">Sacar un tema</button>
    </div>

    <section class="timer" aria-label="Cronómetro">
      <div class="seg" role="tablist">
        <button id="mResearch" class="active" role="tab">Investigar · 15:00</button>
        <button id="mPresent" role="tab">Presentar · 1:00</button>
      </div>
      <div class="clock" id="clock">15:00</div>
      <div class="timer-btns">
        <button class="tbtn primary" id="startBtn">Iniciar</button>
        <button class="tbtn" id="resetBtn">Reiniciar</button>
      </div>
      <button class="sound" id="soundBtn">🔔 Sonido: activado</button>
    </section>

    <footer class="rules">
      <span class="chip"><b>×</b> Sin IA</span>
      <span class="chip"><b>◆</b> Solo Google Scholar</span>
      <span class="chip"><b>✎</b> Notas a mano</span>
      <div class="meta">
        <span id="seenCount">0 / 0 vistos</span>
        <button id="resetSeen">Reiniciar historial</button>
      </div>
    </footer>
  </main>

/* ----------------------------- refs ----------------------------- */
const $ = s => document.querySelector(s);
const card=$("#card"), conceptEl=$("#concept"), fieldEl=$("#field"),
      altEl=$("#alt"), underline=$("#underline"), drawBtn=$("#draw"),
      filterEl=$("#filter"), clockEl=$("#clock"),
      startBtn=$("#startBtn"), resetBtn=$("#resetBtn"),
      mResearch=$("#mResearch"), mPresent=$("#mPresent"),
      soundBtn=$("#soundBtn"), seenCountEl=$("#seenCount"), resetSeenBtn=$("#resetSeen");

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let seen = new Set();
let lastId = null;
let soundOn = true;

/* build filter options */
[...new Set(TOPICS.map(t=>t.field))].sort((a,b)=>a.localeCompare(b,"es")).forEach(f=>{
  const o=document.createElement("option"); o.value=f; o.textContent=f; filterEl.appendChild(o);
});

/* ----------------------------- persistence ----------------------------- */
const STORE_KEY="unprompted_seen_v2";
async function loadSeen(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){ JSON.parse(raw).forEach(id=>seen.add(id)); }
  }catch(e){/* first run or unavailable */}
  updateSeen();
}
async function persistSeen(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify([...seen]));
  }catch(e){/* ignore */}
}
function updateSeen(){ seenCountEl.textContent = `${seen.size} / ${TOPICS.length} vistos`; }

/* ----------------------------- draw a topic ----------------------------- */
function pool(){
  const f=filterEl.value;
  return f==="all" ? TOPICS : TOPICS.filter(t=>t.field===f);
}
function pick(){
  const p=pool();
  let cand=p.filter(t=>!seen.has(t.id));
  if(cand.length===0){                    // cycle complete for this pool → start fresh
    p.forEach(t=>seen.delete(t.id));
    cand=p.slice();
  }
  if(cand.length>1 && lastId!==null) cand=cand.filter(t=>t.id!==lastId);
  return cand[Math.floor(Math.random()*cand.length)];
}

let shuffleTimer=null;
function reveal(topic){
  card.classList.remove("idle");
  card.classList.add("revealed");
  conceptEl.textContent=topic.es;
  fieldEl.textContent=topic.field;
  altEl.innerHTML = `también: <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(topic.en)}" target="_blank" rel="noopener">${topic.en} ↗</a>`;
  // replay ink underline
  underline.classList.remove("draw");
  void underline.offsetWidth;
  if(!reduce) underline.classList.add("draw");
  lastId=topic.id;
  seen.add(topic.id);
  updateSeen(); persistSeen();
  // reset timer to research after a fresh draw
  setMode("research", true);
}

function draw(){
  const topic=pick();
  drawBtn.textContent="Sacar otro";
  if(reduce){ reveal(topic); return; }
  // shuffle flicker through candidate names, then settle
  card.classList.remove("idle");
  card.classList.add("shuffling");
  const names=pool();
  let ticks=0;
  clearInterval(shuffleTimer);
  shuffleTimer=setInterval(()=>{
    conceptEl.textContent=names[Math.floor(Math.random()*names.length)].es;
    if(++ticks>10){
      clearInterval(shuffleTimer);
      card.classList.remove("shuffling");
      reveal(topic);
    }
  },48);
}
drawBtn.addEventListener("click", draw);
filterEl.addEventListener("change", ()=>{ lastId=null; });

/* keyboard: press "n" for a new topic */
document.addEventListener("keydown", e=>{
  if((e.key==="n"||e.key==="N") && document.activeElement.tagName!=="SELECT"){ draw(); }
});

/* ----------------------------- timer ----------------------------- */
const DUR={research:900, present:60};
let mode="research", remaining=DUR.research, running=false, tick=null;

function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
function renderClock(){
  clockEl.textContent=fmt(remaining);
  clockEl.classList.toggle("low", remaining<=30 && remaining>0 && !clockEl.classList.contains("done"));
}
function setMode(m, keepStopped){
  mode=m;
  mResearch.classList.toggle("active", m==="research");
  mPresent.classList.toggle("active", m==="present");
  stop();
  clockEl.classList.remove("done","low");
  remaining=DUR[m];
  renderClock();
}
function stop(){ running=false; clearInterval(tick); startBtn.textContent="Iniciar"; startBtn.classList.add("primary"); }
function start(){
  if(running){ stop(); return; }
  if(remaining<=0){ remaining=DUR[mode]; clockEl.classList.remove("done"); }
  running=true; startBtn.textContent="Pausar"; startBtn.classList.remove("primary");
  tick=setInterval(()=>{
    remaining--;
    renderClock();
    if(remaining<=0){
      clearInterval(tick); running=false;
      startBtn.textContent="Iniciar"; startBtn.classList.add("primary");
      clockEl.classList.remove("low"); clockEl.classList.add("done");
      chime();
    }
  },1000);
}
startBtn.addEventListener("click", start);
resetBtn.addEventListener("click", ()=>setMode(mode,true));
mResearch.addEventListener("click", ()=>setMode("research"));
mPresent.addEventListener("click", ()=>setMode("present"));

/* ----------------------------- sound ----------------------------- */
let audioCtx=null;
function chime(){
  if(!soundOn) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [880,660].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+i*0.28;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.start(t); o.stop(t+0.55);
    });
  }catch(e){/* audio unavailable */}
}
soundBtn.addEventListener("click", ()=>{
  soundOn=!soundOn;
  soundBtn.textContent = soundOn ? "🔔 Sonido: activado" : "🔕 Sonido: apagado";
});

/* ----------------------------- reset history ----------------------------- */
resetSeenBtn.addEventListener("click", ()=>{
  seen.clear(); lastId=null; updateSeen(); persistSeen();
});

/* ----------------------------- init ----------------------------- */
renderClock();
loadSeen();
